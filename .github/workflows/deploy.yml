name: Build and Deploy Spring Boot App to EC2

on:
  push:
    branches: [ master ]  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: |
        cd Boot01
        mvn clean package -DskipTests

    - name: 🔍 DEBUG: Print EC2_HOST
      run: |
        echo "EC2_HOST is ${{ secrets.EC2_HOST }}"

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        # EC2_HOST에서 IP만 추출해서 ssh-keyscan에 전달
        HOST=$(echo "${{ secrets.EC2_HOST }}" | cut -d'@' -f2)
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

    - name: Deploy JAR to EC2 and run
      run: |
        scp Boot01/target/*.jar ${{ secrets.EC2_HOST }}:/home/ec2-user/
        ssh ${{ secrets.EC2_HOST }} 'pkill -f .jar || true'
        ssh ${{ secrets.EC2_HOST }} 'nohup java -jar /home/ec2-user/*.jar > app.log 2>&1 &'
